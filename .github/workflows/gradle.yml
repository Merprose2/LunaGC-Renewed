name: Java CI with Gradle

on:
  push:
    branches: [ "7.0" ]

  pull_request:
    branches: [ "7.0" ]

  # Allows the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# Enforce strictly ONE workflow run at a time across the entire repository.
# Any new run will immediately cancel older running/queued runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Required for creating releases and submitting the dependency graph.
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Automatically caches dependencies, build outputs and the configuration cache
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        # Only the default branch is allowed to write the build cache, all other
        # runs read from it (keeps caches clean and reproducible).
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/7.0' }}

    # The configuration cache and the build cache are enabled in gradle.properties
    # (so that gradle/actions/setup-gradle caches them), the flags below only make
    # the intent explicit for a one-shot CI build.
    # --no-watch-fs : file system watching makes no sense for a one-shot CI build
    # -x spotlessCheck -x test : skip the formatting check and the test suite
    - name: Build with Gradle Wrapper
      run: >
        ./gradlew jar
        --build-cache
        --no-watch-fs
        -PskipHandbook=1
        -x spotlessCheck -x test

    - name: Verify compiled JAR
      run: |
        test -f LunaGC-7.0.jar
        ls -lh LunaGC-7.0.jar

    # Keeps only 1 day of retention. The jar is already compressed, so storing
    # it without additional compression makes the upload much faster.
    - name: Archive Artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-7.0-${{ github.sha }}
        path: LunaGC-7.0.jar
        if-no-files-found: error
        compression-level: 0
        retention-days: 1

    # Only publish a release after an actual commit to 7.0.
    - name: Publish release
      if: github.event_name == 'push' && github.ref == 'refs/heads/7.0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view release >/dev/null 2>&1; then
          gh release delete release --cleanup-tag --yes
        fi

        gh release create release \
          LunaGC-7.0.jar \
          --target "${GITHUB_SHA}" \
          --title "LunaGC-Renewed 7.0 Release" \
          --notes "Automatically compiled from LunaGC-Renewed 7.0 commit ${GITHUB_SHA}." \
          --latest
