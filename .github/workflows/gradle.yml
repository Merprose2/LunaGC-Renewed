name: Java CI with Gradle

on:
  push:
    branches: [ "7.0" ]

  pull_request:
    branches: [ "7.0" ]

  # Allows the workflow to be started manually from the Actions tab.
  workflow_dispatch:

# Enforce strictly ONE workflow run at a time across the entire repository.
# Any new run will immediately cancel older running/queued runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # Required for creating releases and submitting the dependency graph.
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    # Automatically caches dependencies and Gradle build outputs
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/7.0' }}

    # -x spotlessCheck -x test skips re-formatting checks and test suites during binary creation
    - name: Build with Gradle Wrapper
      run: ./gradlew jar --no-daemon --build-cache -PskipHandbook=1 -x spotlessCheck -x test

    - name: Verify compiled JAR
      run: |
        test -f LunaGC-7.0.jar
        ls -lh LunaGC-7.0.jar

    # Keeps only 1 day of retention and uses default compression to save quota
    - name: Archive Artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-7.0-${{ github.sha }}
        path: LunaGC-7.0.jar
        if-no-files-found: error
        retention-days: 1

    # Only publish a release after an actual commit to 7.0.
    - name: Publish release
      if: github.event_name == 'push' && github.ref == 'refs/heads/7.0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view release >/dev/null 2>&1; then
          gh release delete release --cleanup-tag --yes
        fi

        gh release create release \
          LunaGC-7.0.jar \
          --target "${GITHUB_SHA}" \
          --title "LunaGC-Renewed 7.0 Release" \
          --notes "Automatically compiled from LunaGC-Renewed 7.0 commit ${GITHUB_SHA}." \
          --latest
