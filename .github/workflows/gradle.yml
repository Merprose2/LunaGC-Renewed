name: Java CI with Gradle

on:
  push:
    branches: [ "7.0" ]
  pull_request:
    branches: [ "7.0" ]
  workflow_dispatch:

concurrency:
  group: lunagc-7.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/7.0' }}
        # Automatically manages wrapper & build caching

    - name: Fast Build Jar
      # -x spotlessCheck avoids re-checking code styling during artifact build
      run: ./gradlew shadowJar -PskipHandbook=1 -x spotlessCheck --parallel

    - name: Verify compiled JAR
      run: |
        test -f LunaGC-7.0.jar
        ls -lh LunaGC-7.0.jar

    - name: Archive Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-7.0-${{ github.sha }}
        path: LunaGC-7.0.jar
        retention-days: 7
        compression-level: 0

    - name: Publish rolling development release
      if: github.event_name == 'push' && github.ref == 'refs/heads/7.0'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete latest-dev --cleanup-tag --yes || true
        gh release create latest-dev LunaGC-7.0.jar \
          --target "${GITHUB_SHA}" \
          --title "Latest LunaGC-Renewed 7.0 Development Build" \
          --notes "Automatically compiled from LunaGC-Renewed 7.0 commit ${GITHUB_SHA}." \
          --prerelease \
          --latest=false
