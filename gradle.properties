# Enable parallel execution of decoupled tasks
org.gradle.parallel=true

# Keep daemon alive for faster step transitions
org.gradle.daemon=true

# Cache task outputs across builds
org.gradle.caching=true

# Fine-tune JVM memory for GitHub Actions Standard Runner (7GB limit)
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
