# ---------------------------------------------------------------------------
# Gradle build performance
# https://docs.gradle.org/current/userguide/build_environment.html
# ---------------------------------------------------------------------------

# Run decoupled tasks of independent projects in parallel.
org.gradle.parallel=true

# Keep the daemon alive: the JVM, javac and Lombok stay warm between builds.
org.gradle.daemon=true

# Reuse task outputs between builds (local cache + the cache provided by
# gradle/actions/setup-gradle on CI).
org.gradle.caching=true

# Skip the configuration phase whenever the build configuration did not change.
org.gradle.configuration-cache=true

# If some task/plugin ever becomes incompatible with the configuration cache,
# fall back with a warning instead of failing the build.
org.gradle.configuration-cache.problems=warn

# Watch the file system instead of re-scanning it on every build.
org.gradle.vfs.watch=true

# Daemon heap. javac runs in its own forked JVM (see build.gradle), so the
# daemon only needs enough room for Gradle itself + the file system snapshot.
# 3g fits the GitHub Actions standard runner (7 GB) together with the compiler.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Use an already installed JDK 25 when there is one, only download it otherwise.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
