import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.plugins.ide.eclipse.model.SourceFolder

buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.8.18'
    }
}

plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'com.google.protobuf' version '0.8.18'
    id 'com.diffplug.spotless' version '6.11.0'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'signing'
    id 'io.freefair.lombok' version '6.6.1'
}

// Generate the BuildConfig.java file before compiling Java
tasks.register('injectGitHash') {
    def gitCommitHash = {
        try {
            return 'git rev-parse --verify --short HEAD'.execute().text.trim()
        } catch (ignored) {
            return 'GIT_NOT_FOUND'
        }
    }

    doLast {
        def buildConfigFile = file('src/main/java/emu/grasscutter/BuildConfig.java')
        buildConfigFile.parentFile.mkdirs()
        buildConfigFile.text = """package emu.grasscutter;

public final class BuildConfig {
    public static final String VERSION = "${version}";
    public static final String GIT_HASH = "${gitCommitHash()}";
}"""
    }
}

compileJava {
    options.encoding = "UTF-8"
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx2500m', '-XX:+UseParallelGC']
    options.incremental = true
    dependsOn tasks.named('injectGitHash')
}

compileTestJava.options.encoding = 'UTF-8'

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

group = 'io.grasscutter'
version = '7.0'

// Disable Javadoc & Source JARs during standard CI builds
if (gradle.startParameter.taskNames.any { it.contains('publish') }) {
    java {
        withJavadocJar()
        withSourcesJar()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation group: 'it.unimi.dsi', name: 'fastutil', version: '8.5.8'

    // Logging libraries
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.7'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.4.7'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.7'

    // Line reading libraries
    implementation group: 'org.jline', name: 'jline', version: '3.21.0'
    implementation group: 'org.jline', name: 'jline-terminal-jna', version: '3.21.0'
    implementation group: 'net.java.dev.jna', name: 'jna', version: '5.10.0'

    // Java Netty for networking
    implementation group: 'io.netty', name: 'netty-common', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-handler', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-epoll', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-kqueue', version: '4.1.86.Final'

    // Serialization
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '3.19.6'
    implementation group: 'com.github.os72', name: 'protobuf-dynamic', version: '1.0.1'

    implementation platform('com.fasterxml.jackson:jackson-bom:2.14.0')
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.2'

    // Reflections libraries
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
    implementation group: 'com.esotericsoftware', name: 'reflectasm', version: '1.11.9'
    implementation group: 'com.github.davidmoten', name: 'rtree-multi', version: '0.1'

    // MongoDB object mapper
    implementation group: 'dev.morphia.morphia', name: 'morphia-core', version: '2.2.7'

    // Utility libraries
    implementation group: 'org.greenrobot', name: 'eventbus-java', version: '3.3.1'

    // Long-term scheduler
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.3.2'
    implementation group: 'org.quartz-scheduler', name: 'quartz-jobs', version: '2.3.2'

    // Lua script engine library
    implementation group: 'org.luaj', name: 'luaj-jse', version: '3.0.1'

    // Java HTTP server library
    implementation group: 'io.javalin', name: 'javalin', version: '5.5.0'

    // Java WebSocket server & client library
    implementation group: 'org.java-websocket', name: 'Java-WebSocket', version: '1.5.2'

    // Xxhash
    implementation group: 'net.openhft', name: 'zero-allocation-hashing', version: '0.26ea0'

    // Testing libraries
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.8.2'
    testImplementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.10.0'

    // Lombok
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.30'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    getMainClass().set('emu.grasscutter.Grasscutter')
}

// Check if raw .proto files actually exist
def protoDir = file('proto')
boolean hasProtos = protoDir.exists() && (protoDir.listFiles()?.any { it.name.endsWith('.proto') } ?: false)

if (hasProtos) {
    dependencies {
        protobuf files('proto/')
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.18.1'
        }
        generatedFilesBaseDir = "$projectDir/src/generated"
    }

    sourceSets {
        main {
            proto {
                srcDir 'proto'
            }
            java {
                srcDir 'src/main/java'
                srcDir 'src/generated/main/java'
            }
        }
    }

    compileJava.dependsOn 'generateProto'
    processResources.dependsOn 'generateProto'
    delombok.dependsOn 'generateProto'
} else {
    // If no .proto files exist, disable generateProto tasks and compile existing generated code
    tasks.matching { it.name.contains('Proto') }.configureEach {
        enabled = false
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java', 'src/generated/main/java']
            }
        }
    }
}

clean {
    if (hasProtos) {
        delete protobuf.generatedFilesBaseDir
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'LunaGC'
    archiveVersion = '7.0'

    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${archiveExtension}"
    }

    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    from('src/main/java') {
        include '*.xml'
    }

    destinationDirectory = file('.')
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

spotless {
    java {
        target fileTree(rootDir) {
            include 'src/main/java/**/*.java'
            exclude 'src/generated/**/*.*'
            exclude '.idea/**/*.*'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#')
        googleJavaFormat('1.15.0')
        formatAnnotations()
        endWithNewline()
        indentWithTabs(2); indentWithSpaces(4)
        toggleOffOn()
    }
}
