plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'signing'
    id 'io.freefair.lombok' version '9.5.0'
}

// The version is part of the build information generated below, so it has to be
// set before that task gets configured.
group = 'io.grasscutter'
version = '7.0'

// ---------------------------------------------------------------------------
// Build information (version + git revision)
// ---------------------------------------------------------------------------
// These values are written into a *resource* file instead of being generated
// into the Java sources. A new commit therefore no longer changes the input of
// compileJava, so the compiled classes stay valid in the build cache instead of
// being rebuilt from scratch (this is what makes repeated and CI builds fast).
def buildInfoDir = layout.buildDirectory.dir('generated/build-info')
// Captured as a plain String at configuration time: referencing the project's
// `version` from inside the task action would violate the configuration cache.
def projectVersion = version.toString()

def generateBuildInfo = tasks.register('generateBuildInfo') {
    group = 'build'
    description = 'Writes the version and git revision into lunagc-build-info.properties.'

    def outputFile = buildInfoDir.map { it.file('lunagc-build-info.properties') }
    outputs.file(outputFile)

    doLast {
        def gitCommitHash
        try {
            gitCommitHash = 'git rev-parse --verify --short HEAD'.execute().text.trim()
        } catch (ignored) {
            gitCommitHash = ''
        }
        if (!gitCommitHash) {
            gitCommitHash = 'GIT_NOT_FOUND'
        }

        def file = outputFile.get().asFile
        def content = "# Generated by Gradle. Do not edit.\nversion=${projectVersion}\ngitHash=${gitCommitHash}\n"
        // Only write when something changed, so that the tasks consuming this
        // file (processResources, jar, ...) can stay UP-TO-DATE.
        if (!file.exists() || file.text != content) {
            file.parentFile.mkdirs()
            file.text = content
        }
    }
}

// Add the generated file to the classpath resources: it lands in
// build/resources/main and is packaged into the final jar automatically.
sourceSets.main.resources.srcDir(buildInfoDir)
processResources.dependsOn(generateBuildInfo)

compileJava {
    options.encoding = "UTF-8"
    options.incremental = true
    // Fork a dedicated javac JVM. Compiling in the daemon *sounds* faster, but
    // for a project this size Lombok + javac need so much memory that they make
    // the daemon GC-thrash (measured: >3x slower). A separate process keeps the
    // compiler's heap isolated and predictable.
    options.fork = true
    options.forkOptions.jvmArgs += ['-Xmx2500m', '-XX:+UseParallelGC']
}

compileTestJava.options.encoding = 'UTF-8'

// Build and run with Java 25 via the Gradle toolchain, regardless of which
// JVM is used to launch Gradle itself. The toolchain resolver in
// settings.gradle can automatically download a matching JDK if none is found.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Disable Javadoc & Source JARs during standard CI builds
if (gradle.startParameter.taskNames.any { it.contains('publish') }) {
    java {
        withJavadocJar()
        withSourcesJar()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(dir: 'lib', include: ['*.jar'])

    implementation group: 'it.unimi.dsi', name: 'fastutil', version: '8.5.8'

    // Logging libraries
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.7'
    implementation group: 'ch.qos.logback', name: 'logback-core', version: '1.4.7'
    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.4.7'

    // Line reading libraries
    implementation group: 'org.jline', name: 'jline', version: '3.21.0'
    implementation group: 'org.jline', name: 'jline-terminal-jna', version: '3.21.0'
    implementation group: 'net.java.dev.jna', name: 'jna', version: '5.10.0'

    // Java Netty for networking
    implementation group: 'io.netty', name: 'netty-common', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-handler', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-epoll', version: '4.1.86.Final'
    implementation group: 'io.netty', name: 'netty-transport-native-kqueue', version: '4.1.86.Final'

    // Serialization & Protobuf
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.9.0'
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: '3.19.6'
    implementation group: 'com.github.os72', name: 'protobuf-dynamic', version: '1.0.1'

    implementation platform('com.fasterxml.jackson:jackson-bom:2.14.0')
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.14.2'

    // Reflections libraries
    implementation group: 'org.reflections', name: 'reflections', version: '0.10.2'
    implementation group: 'com.esotericsoftware', name: 'reflectasm', version: '1.11.9'
    implementation group: 'com.github.davidmoten', name: 'rtree-multi', version: '0.1'

    // MongoDB object mapper
    implementation group: 'dev.morphia.morphia', name: 'morphia-core', version: '2.2.7'

    // Utility libraries
    implementation group: 'org.greenrobot', name: 'eventbus-java', version: '3.3.1'

    // Long-term scheduler
    implementation group: 'org.quartz-scheduler', name: 'quartz', version: '2.3.2'
    implementation group: 'org.quartz-scheduler', name: 'quartz-jobs', version: '2.3.2'

    // Lua script engine library
    implementation group: 'org.luaj', name: 'luaj-jse', version: '3.0.1'

    // Java HTTP server library
    implementation group: 'io.javalin', name: 'javalin', version: '5.5.0'

    // Java WebSocket server & client library
    implementation group: 'org.java-websocket', name: 'Java-WebSocket', version: '1.5.2'

    // Xxhash
    implementation group: 'net.openhft', name: 'zero-allocation-hashing', version: '0.26ea0'

    // Testing libraries
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: '5.8.2'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.8.2'
    testImplementation group: 'com.squareup.okhttp3', name: 'okhttp', version: '4.10.0'

    // Lombok
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.48'
}

configurations.configureEach {
    exclude group: 'org.slf4j', module: 'slf4j'
}

application {
    getMainClass().set('emu.grasscutter.Grasscutter')
}

// Fast development loop: compiles incrementally and runs the server straight
// from build/classes + the dependency jars, so no jar is packaged at all.
// Use `./gradlew jar` only when you actually need the distributable fat jar.
tasks.named('run', JavaExec) {
    description = 'Runs the server directly from the compiled classes (no jar packaging).'
    standardInput = System.in
    jvmArgs = ['-Xmx2g']
}

// Check if raw .proto files actually exist
def protoDir = file('proto')
boolean hasProtos = protoDir.exists() && (protoDir.listFiles()?.any { it.name.endsWith('.proto') } ?: false)

if (hasProtos) {
    dependencies {
        protobuf files('proto/')
    }

    protobuf {
        protoc {
            artifact = 'com.google.protobuf:protoc:3.18.1'
        }
        generatedFilesBaseDir = "$projectDir/src/generated"
    }

    sourceSets {
        main {
            proto {
                srcDir 'proto'
            }
            java {
                srcDirs = ['src/main/java', 'src/generated/main/java']
            }
        }
    }

    compileJava.dependsOn 'generateProto'
    processResources.dependsOn 'generateProto'
    delombok.dependsOn 'generateProto'
} else {
    tasks.matching { it.name.contains('Proto') }.configureEach {
        enabled = false
    }

    sourceSets {
        main {
            java {
                srcDirs = ['src/main/java', 'src/generated/main/java']
            }
        }
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': 'emu.grasscutter.Grasscutter'
    }

    archiveBaseName = 'LunaGC'
    archiveVersion = '7.0'

    if (project.hasProperty('jarFilename')) {
        archiveFileName = "${jarFilename}.${archiveExtension}"
    }

    // Merge every runtime dependency into the jar.
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }

    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    // Signature files and module descriptors of the merged dependencies are
    // invalid (or harmful) once everything lives in a single un-signed jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC', 'module-info.class'

    // Binary-identical output for identical inputs -> reproducible builds and
    // reliable build cache hits.
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    destinationDirectory = file('.')
}

test {
    useJUnitPlatform()
    maxHeapSize = '2G'
}

spotless {
    java {
        // Only the project's own sources are formatted; scanning the whole
        // project root on every configuration would be wasteful.
        target fileTree('src/main/java') {
            include '**/*.java'
        }

        importOrder('io.grasscutter', '', 'java', 'javax', '\\#java', '\\#')
        googleJavaFormat('1.30.0')
        formatAnnotations()
        endWithNewline()
        indentWithTabs(2); indentWithSpaces(4)
        toggleOffOn()
    }
}